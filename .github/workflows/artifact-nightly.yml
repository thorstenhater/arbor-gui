name: Nightly

on:
  push:
    branches: nightly_action
    tags:
      - v*
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC
  # pull_request:
  #   branches: [ master ]

jobs:
  build_appimage:
    name: "Make AppImage Nightly"
    runs-on: ubuntu-18.04
    steps:
      - name: install dependencies
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt install -y build-essential python3-pip libxml2-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev gcc-10 g++-10
          sudo pip3 install --upgrade pip cmake
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 10
      - name: "Clone w/ submodules"
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Make AppImage
        run: sh ./scripts/appimage.sh
      - uses: actions/upload-artifact@v2
        with:
          name: AppImage
          path: './*.AppImage*'

  build_diskim:
    name: "Make Apple Disk Image Nightly"
    runs-on: macos-10.15
    steps:
      - name: "Clone w/ submodules"
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++ -DCMAKE_C_COMPILER=$(brew --prefix llvm)/bin/clang -DARBORGUI_BUILD_BUNDLE=ON
      - name: Build
        run: cmake --build build --target package
      - name: Upload .dmg
        uses: actions/upload-artifact@v2
        with:
          name: arbor-gui.dmg
          path: build/*.dmg

  make_rel:
    name: Make Release
    needs: [build_diskim, build_appimage]
    runs-on: ubuntu-latest

    steps:
      - name: "Get artifacts"
        uses: actions/download-artifact@v2
        with:
          path: .
      - name: Display structure of downloaded files
        run: ls -R
      - name: "Make Release"
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag: ${{ github.ref }}
          name: Nightly build
          omitBody: true
          draft: true
          prerelease: true
          artifacts: '*.dmg,*.AppImage'
          token: ${{ secrets.GITHUB_TOKEN }}
          